name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright pytest-html pytest-rerunfailures pytest-md

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps

      - name: Run tests and generate reports
        env:
          PYTHONPATH: .
        run: |
          mkdir -p output_artifacts
          # Generates both a clean markdown text table and a standalone backup HTML document
          pytest --md=output_artifacts/test_report.md --html=output_artifacts/test_execution_report.html --self-contained-html --reruns 2

      - name: Publish report to Confluence
        env:
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SPACE_KEY: GithubCopi
          PYTHONPATH: .
        run: |
          python scripts/publish_confluence.py

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-test-reports
          path: output_artifacts/
