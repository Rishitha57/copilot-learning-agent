name: Copilot Capstone CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: playwright install --with-deps

    - name: Run Pytest & Generate HTML Report
      run: |
        pytest --html=output_artifacts/test_execution_report.html --self-contained-html -v

    - name: Publish Report to Confluence
      env:
        CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
        CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
        CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        CONFLUENCE_SPACE_KEY: "GithubCopi"
      run: |
        python scripts/publish_confluence.py

    - name: Upload Test Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sdlc-test-reports
        path: output_artifacts/
